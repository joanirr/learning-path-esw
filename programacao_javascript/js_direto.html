<!DOCTYPE html>
<html lang="pt-BR">
<head>
     <meta charset="UTF-8">
     <title>Incorporando JavaScript em Páginas HTML</title>
     <!-- Incorporando um arquivo .js externo -->
     <script src="js_direto.js"></script>
</head>
<body>
     <div id="exibe_resultado"> Resultado da Multiplicação: </div>
</body>
     <!-- Incorporando códigos JavaScript diretamente na página -->
      <script type="text/javascript">
          // Com duas barras criamos um comentário de linha em JavaScript
          // Comentários de mais de uma linha podem ser feitos dentro de /* */

          var variavel; // Declarando uma variável cujo nome é "variavel"
          variavel = 3 + 3; // Atribuindo valores e aplicando uma operaçào matemática em uma variável

          /* Utilizando a funçào nativa 'alert' para exibir uma caixa de diálogo
             com o valor armazenado na variável */

          alert(variavel);

          var resultadoMultiplicacao = multiplique(10, 50); // Chamando a função 'multiplique' 
          // passando dois valores - 10 e 50

          /* Manipulando a Árvore DOM a fim de exibir, dentro da DIV declarada no HTML,
             o resultado da multiplicação juntamente com seu texto inicial*/
          var divLocal = document.getElementById("exibe_resultado");
          /*
          Neste ponto a variável divLocal é um objeto que representa a div declarada no HTML.
          Sendo um objeto é possível acessar seus atributos, como innerHTML, precedido do nome 
          do objeto seguido de um '.'
          */
         divLocal.innerHTML += resultadoMultiplicacao;

         //Definição da função 'multiplique' que recebe dois parâmetros - numero1 e numero2
         function multiplique(numero1, numero2){

               /*
               Declarando uma nova variável que guardará o resultado da multiplicação;
               Iniciando a variável com valor de 0.
               */
               var resultado = 0;

               //Atribuindo à variável resultado o valor da multiplicação dos dois parâmetros
               resultado = numero1 * numero2;

               //Retornando o valor da variável resultado
               return resultado;
         }
      </script>
</html>
